name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android source
        run: |
          if [ -f android/settings.gradle.kts ]; then
            echo "Using maintained Android source"
          else
            rm -rf android
            mkdir android
            unzip -q TikTokAIStudio-AndroidProject.zip -d android
          fi
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > android/gradle.properties
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Persist extracted source
        run: |
          if git status --porcelain android | grep -q .; then
            git config user.name "TikTokAIStudio Bot"
            git config user.email "actions@github.com"
            git add android
            git commit -m "Extract maintainable Android source"
            git push
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAIStudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
