name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TikTokAIStudio-AndroidProject.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q TikTokAIStudio-AndroidProject.zip -d android-project
          echo "Project extracted"
          find android-project -maxdepth 3 -type f | head -50

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAIStudio-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
